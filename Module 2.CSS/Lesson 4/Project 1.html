<!DOCTYPE html>
<html>

<head>
    <title>My Ice Cream Shop Menu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e00d81;
            text-align: center;
            color: #4a2c2a;
        }

        h1 {
            color: #4133d6;
            font-size: 36px;
        }

        h1+p {
            color: #2bb1e2;
            font-weight: bold;
            background-color: #ffe3f1;
            border-radius: 10px;
        }

        .shop-description::first-letter {
            font-size: 36px;
            color: #ff14c8;
            font-weight: bold;
        }

        .menu-box {
            width: 420px;
            background-color: white;
            border: 3px solid #552df7;
            border-radius: 15px;
            margin: 20px auto;
            padding: 20px;
        }

        ul {
            padding: 0;
        }

        ul>li {
            list-style: none;
            background-color: #fff0f5;
            color: #5c2a4a;
            font-size: 18px;
            font-weight: bold;
            margin: 10px;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #9271ff;
        }

        ul>li:nth-child(3) {
            background-color: #fff3cd;
            color: #b85c00;
            border: 3px solid #ffa500;
        }

        ul>li:hover {
            background-color: #ff69b4;
            color: white;
            cursor: pointer;
            transform: scale(1.05);
        }

        button {
            background-color: #f31a1a;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background-color: #2b50e2;
            transition-duration: 0.7s;
        }
    </style>
</head>

<body>
    <h1>My Ice Cream Shop Menu</h1>
    <p>Welcome to Scoops of Joy!</p>
    <p class="shop-description">
        We serve colourful, creamy, and delicious ice cream flavours.
    </p>
    <div class="menu-box">
        <h2>Today's Ice Cream Flavours</h2>
        <ul>
            <li>Berry Explosion</li>
            <li>Chocolate Avalanche</li>
            <li>Caramel Crunchwave - Today's Special</li>
            <li>Vanilla Dream</li>
            <li>Mint Shiver</li>
        </ul>
        <button>Order Now</button>
    </div>
</body>

</html>
